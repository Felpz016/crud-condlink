# Roda o TypeScript e os testes em cada push e pull request.
# MUDANÇA 5 de 5 (testes automáticos): o GitHub roda o npm run check e o npm test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
